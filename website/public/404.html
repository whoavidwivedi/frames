<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Frames</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="container" style="max-width: 600px; text-align: center;">
    <div class="hero-pill-badge" style="margin-bottom: 16px;">
      <span class="dot"></span>
      <span class="font-mono">Error 404</span>
    </div>
    <h1 class="hero-heading gradient-heading" style="font-size: 48px; margin-bottom: 16px;">
      Lost frame in sequence
    </h1>
    <p class="hero-subheading" style="margin-bottom: 32px;">
      The requested page does not exist or has been relocated in the media dashboard.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="/" class="btn-primary">
        <span>Return to Home</span>
      </a>
      <a href="/download" class="btn-secondary">
        <span>Download DMG</span>
      </a>
    </div>
  </div>
</body>
</html>
