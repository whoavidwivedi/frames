name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release-zip:
    name: Package Release ZIP (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Release App
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS,arch=arm64" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_PARALLEL_WHOLE_MODULE_OPTIMIZATION=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import Developer ID signing identity
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "::error::Developer ID signing secrets are not configured. Unsigned releases are not published."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/frames-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p frames-ci "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p frames-ci "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k frames-ci "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign and Notarize Release App
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/DerivedData/Build/Products/Release/frames.app"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::Notarization secrets are not configured. Unsigned/notarization-less releases are not published."
            exit 1
          fi
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/frames-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/frames-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vvv "$APP"

      - name: Package ZIP and Checksums
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          APP="build/DerivedData/Build/Products/Release/frames.app"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Frames-v${VERSION}-macOS.zip"
          cd dist
          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          draft: ${{ inputs.draft || false }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
