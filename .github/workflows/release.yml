name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release-zip:
    name: Package Release ZIP (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Release App
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS,arch=arm64" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_PARALLEL_WHOLE_MODULE_OPTIMIZATION=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package ZIP and Checksums
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          APP="build/DerivedData/Build/Products/Release/frames.app"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Frames-v${VERSION}-macOS.zip"
          cd dist
          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          draft: ${{ inputs.draft || false }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
