name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release-dmg:
    name: Package Release DMG (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Permissions
        run: |
          chmod +x packaging/build_dmg.sh scripts/release.sh scripts/sign_and_notarize.sh

      - name: Build Release App and DMG Package
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          echo "Building Frames Release v${VERSION}..."
          ./packaging/build_dmg.sh "$VERSION"

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt || shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          draft: ${{ inputs.draft || false }}
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
