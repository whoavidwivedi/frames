name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.2.0)'
        required: true
      revision:
        description: 'Optional expected main commit'
        required: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
      title:
        description: 'Optional release title'
        required: false
      notes:
        description: 'Optional release notes'
        required: false
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false

concurrency:
  group: publish-frames
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release-zip:
    name: Package Release ZIP (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Dispatch from main."; exit 1; }
            [[ -z "$INPUT_REVISION" || "$INPUT_REVISION" == "$GITHUB_SHA" ]] || { echo "::error::main advanced. Recheck the release revision."; exit 1; }
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo "::error::Tag points at a different revision."; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test release revision
        run: |
          xcodebuild -project frames.xcodeproj -scheme frames -configuration Debug \
            -destination "platform=macOS,arch=arm64" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build Release App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS,arch=arm64" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_PARALLEL_WHOLE_MODULE_OPTIMIZATION=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMES_DEVELOPER_TEAM_ID="$APPLE_TEAM_ID" \
            build

      - name: Check signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASES }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && \
             [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && \
             [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [[ -n "$MACOS_CERTIFICATE$MACOS_CERTIFICATE_PASSWORD$MACOS_SIGNING_IDENTITY$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD" ]]; then
            echo "::error::Incomplete Developer ID configuration."
            exit 1
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Building an ad-hoc signed release."
          else
            echo "::error::Developer ID signing secrets are not configured. Set ALLOW_UNSIGNED_RELEASES=true to knowingly publish an unverifiable build."
            exit 1
          fi

      - name: Ad-hoc sign unsigned release app
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          APP="build/DerivedData/Build/Products/Release/frames.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q 'Signature=adhoc'

      - name: Import Developer ID signing identity
        if: steps.signing.outputs.mode == 'signed'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/frames-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p frames-ci "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p frames-ci "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k frames-ci "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign and Notarize Release App
        if: steps.signing.outputs.mode == 'signed'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/DerivedData/Build/Products/Release/frames.app"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/frames-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/frames-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vvv "$APP"

      - name: Package ZIP and installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh build/DerivedData/Build/Products/Release/frames.app "$VERSION" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MODE: ${{ steps.signing.outputs.mode }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "${TITLE:-Frames $TAG}" --generate-notes)
          assets=("dist/Frames-$TAG-macOS.zip" dist/SHA256SUMS.txt dist/Frames-migrate.command)
          [[ "$DRAFT" != true ]] || args+=(--draft)
          if [[ "$PRERELEASE" == true || "$TAG" == *-* ]]; then args+=(--prerelease); fi
          body="$RUNNER_TEMP/frames-release.md"
          printf '%s\n' "$NOTES" > "$body"
          if [[ "$MODE" == unsigned ]]; then
            cat > dist/UNSIGNED_BUILD.txt <<'EOF'
          This build is ad-hoc signed. Apple has not verified the publisher or notarized Frames.
          Download and unzip the macOS ZIP, move Frames to Applications, and open it.
          If macOS blocks first launch, use System Settings > Privacy & Security > Open Anyway for Frames.
          The installer and in-app updater verify the SHA-256 checksum and request your consent.
          Users on 1.9.4 or 1.9.5 can use the Frames-migrate.command installer in this release.
          EOF
            cat dist/UNSIGNED_BUILD.txt >> "$body"
            assets+=(dist/UNSIGNED_BUILD.txt)
          fi
          gh release create "$TAG" "${assets[@]}" "${args[@]}" --notes-file "$body"
