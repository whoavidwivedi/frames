name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep every queued run, including intermediate pushes to main. `queue: max`
  # is required because the default single-slot queue otherwise replaces older
  # pending runs with newer ones.
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (macOS Apple Silicon)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode Environment
        run: |
          uname -a
          sw_vers
          xcodebuild -version

      - name: Build Frames (Debug Configuration)
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Execute Automated Test Suite
        run: |
          xcodebuild test \
            -project frames.xcodeproj \
            -scheme frames \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/FramesTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Release Script
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh --help

      - name: Exercise install, upgrade, integrity checks and rollback
        run: bash scripts/test-install.sh

      - name: Build and verify the distributable app
        run: |
          xcodebuild -project frames.xcodeproj -scheme frames -configuration Release \
            -destination "platform=macOS,arch=arm64" -derivedDataPath build/DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          app="build/DerivedData/Build/Products/Release/frames.app"
          icon=$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")
          test "$icon" = FramesWordmark
          test -s "$app/Contents/Resources/$icon.icns"
          codesign --force --sign - "$app"
          version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          bash scripts/package-release.sh "$app" "$version" build/preview

      - name: Upload the verified Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: Frames-Apple-Silicon
          path: |
            build/preview/*.zip
            build/preview/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
