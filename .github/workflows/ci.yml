name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep every queued run, including intermediate pushes to main. `queue: max`
  # is required because the default single-slot queue otherwise replaces older
  # pending runs with newer ones.
  cancel-in-progress: false
  queue: max

jobs:
  test-and-build:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode Environment
        run: |
          uname -a
          sw_vers
          xcodebuild -version

      - name: Build Frames (Debug Configuration)
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Execute Automated Test Suite
        run: |
          xcodebuild test \
            -project frames.xcodeproj \
            -scheme frames \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/FramesTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Release Script
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh --help

      - name: Verify Migration Script
        run: |
          chmod +x scripts/migrate.command
          bash -n scripts/migrate.command
          ./scripts/migrate.command --help
          ./scripts/migrate.command --dry-run
