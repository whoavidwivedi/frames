name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS and Xcode Environment
        run: |
          uname -a
          sw_vers
          xcodebuild -version

      - name: Build Frames (Debug Configuration)
        run: |
          xcodebuild -project frames.xcodeproj \
            -scheme frames \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Execute Automated Test Suite
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug/frames.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "frames.app" -type d | grep "Build/Products/Debug/frames.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Could not find compiled frames.app bundle"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          "$APP_PATH/Contents/MacOS/frames" --run-tests

      - name: Verify Release Script
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh --help
